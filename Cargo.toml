[package]
name = "bitcoin"
version = "0.1.0"
authors = ["Miquel A. Cabot <miquel.cabot@gmail.com>"]
edition = "2021"

[lib]
name = "bitcoin"
path = "src/lib.rs"

[dependencies]
crossterm = { version = "0.28.1", features = ["event-stream"] }
futures = "0.3.31"
num-bigint = "0.4.5"
rand = "0.8.5"
ratatui = "0.29.0"
sha2 = "0.10.8"
tokio = { version = "1.41.1", features = ["full"] }

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
